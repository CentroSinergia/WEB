  <style>
    :root {
      --bg-color: #1b7ab9;
      --btn-color: #ffffff;
      --btn-text: #1b7ab9;
      --btn-height: 60px; /* Same height for both circle and capsule buttons */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      flex: 1;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 250px;
      height: auto;
      display: block;
    }

    /* Social row (Circular buttons) */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--btn-height);
      height: var(--btn-height);
      color: var(--btn-color); /* Makes the SVG white */
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
    }

    .btn-circle:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.2));
    }

    .btn-circle svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    /* Capsule button */
    .btn-capsule {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--btn-height);
      background-color: var(--btn-color);
      color: var(--btn-text);
      text-decoration: none;
      border-radius: calc(var(--btn-height) / 2);
      font-size: 1.1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn-capsule:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    .footer-phone {
      margin-top: auto;
      margin-bottom: 40px;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 1px;
    }

  </style>
</head>
