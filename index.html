<!doctype html>
<html lang="es">
  <head>

    <title>Centro Holístico - Contacto</title>

      body {
        font-family: sans-serif;
        text-align: center;
        background: #f4f7f6;

        padding: 20px;
      }
      .btn {
        display: block;
        width: 80%;
        max-width: 300px;
        margin: 15px auto;
        padding: 15px;

        color: white;
        border-radius: 50px;

        transition: 0.3s;

      .btn-ws {
        background-color: #25d366;
      }
      .btn-call {
        background-color: #34b7f1;
      }
      .btn-ig {
        background-color: #e1306c;
      }
      .btn-pdf {
        background-color: #555;
        margin-top: 30px;
      }
      img {
        width: 150px;
        border-radius: 50%;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <img src="tu-logo.png" alt="Logo Centro Holístico" />

    <p>¿Cómo podemos ayudarte hoy?</p>

    <a href="https://wa.me/TUNUMERO" class="btn btn-ws">WhatsApp Directo</a>
    <a href="tel:+TUNUMERO" class="btn btn-call">Llamar Ahora</a>
    <a href="https://instagram.com/TUUSUARIO" class="btn btn-ig"
      >Síguenos en Instagram</a
    >

    <a href="portafolio.pdf" class="btn btn-pdf" download
